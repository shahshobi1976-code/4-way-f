    <script>
        (function() {
            try {
                if (typeof window !== 'undefined') {
                    // Suppress unhandled third-party extension errors (e.g. MetaMask inpage.js)
                    var isExtensionNoise = function(err, src) {
                        var str = String((err && (err.message || err.stack || err)) || '');
                        var file = String(src || (err && err.filename) || '');
                        return (
                            file.indexOf('chrome-extension://') !== -1 ||
                            file.indexOf('moz-extension://') !== -1 ||
                            file.indexOf('inpage.js') !== -1 ||
                            str.indexOf('MetaMask') !== -1 ||
                            str.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 ||
                            str.indexOf('Failed to connect to MetaMask') !== -1 ||
                            str.indexOf('Cannot set property fetch') !== -1
                        );
                    };

                    window.addEventListener('unhandledrejection', function(event) {
                        if (event && isExtensionNoise(event.reason)) {
                            event.preventDefault();
                            event.stopImmediatePropagation();
                        }
                    }, true);

                    window.addEventListener('error', function(event) {
                        if (event && isExtensionNoise(event.error || event.message, event.filename)) {
                            event.preventDefault();
                            event.stopImmediatePropagation();
                            return true;
                        }
                    }, true);

                    var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
                    var desc = {
                        configurable: true,
                        enumerable: true,
                        get: function() { return currentFetch; },
                        set: function(fn) { currentFetch = fn; }
                    };
                    try { Object.defineProperty(window, 'fetch', desc); } catch (_) {}
                    if (typeof Window !== 'undefined' && Window.prototype) {
                        try { Object.defineProperty(Window.prototype, 'fetch', desc); } catch (_) {}
                    }
                }
            } catch (_) {}
        })();
    </script>
